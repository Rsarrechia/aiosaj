[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aiosaj"
version = "0.2.1"
description = "Async library to read data from SAJ solar inverters (Ethernet and WiFi modules)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["saj", "solar", "inverter", "photovoltaic", "home-assistant"]

authors = [
    { name = "kellerza" },
    { name = "fredericvl", email = "frederic.van.linthoudt@gmail.com" },
]
# Add your email here if you want a public contact on PyPI.
maintainers = [
    { name = "Rafael Sarrechia" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]

dependencies = [
    "aiohttp>=3.8",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
lint = [
    "ruff==0.17.1",
]

[project.urls]
Homepage = "https://github.com/Rsarrechia/aiosaj"
Repository = "https://github.com/Rsarrechia/aiosaj"
Issues = "https://github.com/Rsarrechia/aiosaj/issues"
"Original project" = "https://github.com/fredericvl/pysaj"

[tool.setuptools]
packages = ["aiosaj"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
